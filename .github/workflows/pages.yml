name: pages
# Publishes the survey explorer to GitHub Pages and keeps it current: after every merge (the merge workflow's
# "fold after #n" push is made with the workflow token, which does not trigger push events, so this listens for
# the merge workflow itself), after any other push to main, and on demand.
# The page is site/build.py's output: the map index and a card per surveyed neuron, embedded in one HTML file.
# Cards for new neurons are built from the data release (cached between runs), without the logit effect.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [merge, fold]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # concurrency on the job, not the workflow: a skipped run (a merge workflow that did not merge) must not cancel a real
    # build; builds queue rather than cancel, and each one builds the newest main anyway
    concurrency:
      group: pages-build
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BONSAI_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Data (the release's corpus and scan, cached)
        id: data
        uses: actions/cache@v4
        with:
          path: |
            data/corpus.npz
            data/scan_bonsai1.npz
          key: data-v1
      - name: Download the data release
        if: steps.data.outputs.cache-hit != 'true'
        run: gh release download data-v1 --repo ${{ github.repository }} --dir data --pattern corpus.npz --pattern scan_bonsai1.npz --clobber
      - name: The atlas (per-layer pole tables, the atlas release)
        run: |
          mkdir -p data/atlas
          gh release download atlas --repo ${{ github.repository }} --dir data/atlas --pattern '*.arrow' --clobber || echo "no atlas release yet"
      - name: Cards built by earlier runs (added to the committed cards)
        uses: actions/cache/restore@v4
        with:
          path: .cards-cache.json
          key: cards-${{ github.run_id }}
          restore-keys: cards-
      - name: Toolchain (CPU only) and the tokenizer
        run: |
          pip install --quiet numpy torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers safetensors huggingface_hub pyarrow
          python -c "from huggingface_hub import hf_hub_download as h; [h('prism-ml/Bonsai-8B-unpacked', f, local_dir='models/Bonsai-8B') for f in ('config.json','tokenizer.json','tokenizer_config.json','vocab.json','merges.txt','added_tokens.json','special_tokens_map.json')]"
      - name: Build the site
        run: |
          python - <<'PY'
          import json, pathlib
          c, cache = pathlib.Path("site/cards.json"), pathlib.Path(".cards-cache.json")
          if cache.exists():
              cards = json.loads(c.read_text(encoding="utf-8")) if c.exists() else {}
              cards = {**json.loads(cache.read_text(encoding="utf-8")), **cards}
              c.write_text(json.dumps(cards, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          python site/build.py --no-logits
          cp site/cards.json .cards-cache.json
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/index.html _site/survey.html
          cp site/cards.json _site/cards.json
          cp graph/index.json _site/index.json
          python site/screens.py
          if [ -d site/screens ]; then cp -r site/screens _site/screens; fi
          python site/circuits.py _site/circuits.html
          python site/steering.py _site/steering.html
          touch _site/.nojekyll
      - uses: actions/cache/save@v4
        with:
          path: .cards-cache.json
          key: cards-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
